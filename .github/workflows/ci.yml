name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholder values only; no secrets.
      TUTURUUU_YASHIE_WORKSPACE_ID: 00000000-0000-0000-0000-000000000000
      TUTURUUU_YASHIE_APP_SECRET: placeholder
      YASHIE_APP_ID: placeholder
      YASHIE_APP_SECRET: placeholder
      YASHIE_SESSION_SECRET: placeholder-placeholder-placeholder-1234
      YASHIE_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
